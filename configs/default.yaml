# ARGUS default experiment config
data:
  raw_dir: data/raw
  processed_dir: data/processed
  variant: HI-Small            # IBM AML file prefix: HI-Small, LI-Small, HI-Medium, ...
  split: [0.6, 0.2, 0.2]       # chronological train / val / test fractions

features:
  velocity_window_hours: 24

rules:
  amount_quantile: 0.99        # flag transfers above this train-set amount quantile
  velocity_quantile: 0.99      # flag senders/receivers above this train-set 24h-count quantile

lightgbm:
  n_estimators: 2000
  learning_rate: 0.05
  num_leaves: 63
  min_child_samples: 50
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  # Keep at 1: the threshold is tuned on val anyway. "balanced" (~1300 on HI-Small)
  # saturates scores at 1.0 and dropped test PR-AUC from 0.30 to 0.007.
  scale_pos_weight: 1.0
  early_stopping_rounds: 100
  seed: 42

gnn:
  conv: gine                   # gine | gat | sage
  hidden: 64
  layers: 2
  dropout: 0.1
  # Neighbours sampled per hop (one entry per layer). For relation (src, rel, dst) the
  # number is how many src nodes each dst node pulls in.
  num_neighbors:
    transfers: [20, 10]        # senders into an account
    rev_transfers: [20, 10]    # receivers out of an account
    owns: [1, 1]               # entity -> account: each account's single owner
    owned_by: [10, 5]          # account -> entity: sibling accounts of the same owner
    hosts: [1, 1]              # bank -> account: each account's bank
    held_at: [5, 5]            # account -> bank: a sample of the bank's accounts (banks are hubs)
  temporal: true               # scored transfers only see earlier-or-same-time transfers
  temporal_strategy: last      # sample the most recent neighbours (or: uniform)
  batch_size: 4096
  eval_batch_size: 8192        # temporal (disjoint) subgraphs: ~85 nodes / ~250 edges per transfer
  epochs: 10
  lr: 0.001
  weight_decay: 0.00001
  pos_weight: 5.0              # BCE weight on the laundering class (tuned lightly; see results)
  patience: 3                  # early stop on val PR-AUC
  num_workers: 0
  seed: 42

twin:
  n_banks: 8                   # busiest IBM banks forming the multi-bank world
  end: "2022-09-11"            # HI-Small activity is Sep 1-10; later days are a sparse tail
  n_rings: 400                 # injected rings, spread over train / val / test periods
  seed: 7
  rounds: 4                    # adaptive attacker rounds
  rings:
    p_recruit: 0.5             # share of mules recruited from dormant real accounts
    p_shared_owner: 0.6        # share of rings whose fresh mules share one owner (herder)
    hop_gap_min: 15            # mean minutes between hops
  attacks:
    delay_factor: [20, 80]     # stretch ring timelines 20-80x (minutes -> hours)
    camouflage_per_mule: [3, 8]

eval:
  ring_recall_thresholds: [1.0, 0.5]   # a ring counts as recovered when >= this share of its transfers is flagged

output_dir: outputs
